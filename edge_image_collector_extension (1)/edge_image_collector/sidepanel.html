<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Image Collector</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h2>IMAGE COLLECTOR</h2>
    <p id="status">Waiting for webpage...</p>
  </header>

  <div class="toolbar">

    <span id="count">0 Images</span>

    <button id="download">
      DOWNLOAD ALL
    </button>

  </div>

  <div class="toolbar">
    <button id="refresh">REFRESH IMAGES</button>
  </div>

  <main id="gallery">

    <p class="empty">
      Open a website and scroll to collect images.
    </p>

  </main>

  <script src="sidepanel.js"></script>

</body>
</html>
