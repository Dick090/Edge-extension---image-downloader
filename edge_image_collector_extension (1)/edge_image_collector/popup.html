<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Collector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Image Collector</strong>
    <span id="count">Scanning…</span>
  </header>
  <p class="hint">Scroll the webpage. Newly loaded images will appear here automatically.</p>
  <div class="actions">
    <button id="refresh">Refresh list</button>
    <button id="download" class="primary">Download all</button>
  </div>
  <main id="images"><p class="empty">Open a webpage and scroll to collect images.</p></main>
  <script src="popup.js"></script>
</body>
</html>
